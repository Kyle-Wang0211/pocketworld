name: pw_hevc
description: PocketWorld capture-time HEVC archive (PWVA) + strict-lossless PLY/sidecar compression. Pure Dart + C, zero Swift.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.4.0
dependencies:
  convert: ^3.1.0
  crypto: ^3.0.0
  ffi: ^2.1.0
dev_dependencies:
  test: ^1.25.0
flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
