<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PocketWorld · 粒子快速消失</title>
  <style>
    :root{color-scheme:light;--ink:#111;--muted:#777;--line:#dedede}*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}main{max-width:1160px;margin:0 auto;padding:40px 26px 54px}.eyebrow{margin:0 0 9px;color:#929292;font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:31px;letter-spacing:-.025em}.lead{max-width:800px;margin:12px 0 27px;color:var(--muted);font-size:16px;line-height:1.65}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.choice{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:#fff;cursor:pointer;transition:transform 160ms ease,border-color 160ms ease,box-shadow 160ms ease}.choice:hover{transform:translateY(-3px);border-color:#aaa;box-shadow:0 16px 38px rgba(0,0,0,.07)}.choice.selected{border:2px solid #111;box-shadow:0 0 0 4px rgba(0,0,0,.08),0 18px 45px rgba(0,0,0,.08)}.preview{padding:16px}.task-card{overflow:hidden;aspect-ratio:4/5;border-radius:24px;background:#e5e5e5;box-shadow:inset 0 0 0 1px rgba(0,0,0,.035)}canvas{display:block;width:100%;height:100%}.copy{padding:3px 20px 22px}.title-row{display:flex;align-items:center;gap:10px}.badge{display:flex;width:28px;height:28px;flex:0 0 28px;align-items:center;justify-content:center;border-radius:50%;background:#111;color:#fff;font-size:12px;font-weight:800}h2{margin:0;font-size:18px}.copy p{min-height:48px;margin:10px 0 0;color:#737373;font-size:13px;line-height:1.55}.recommend{position:absolute;top:28px;right:28px;z-index:2;padding:5px 8px;border-radius:999px;background:#111;color:#fff;font-size:10px;font-weight:700}.note{margin:24px auto 0;max-width:760px;color:#777;font-size:13px;line-height:1.6;text-align:center}@media(max-width:840px){.choices{grid-template-columns:1fr}.copy p{min-height:0}}@media(prefers-reduced-motion:reduce){.choice{transition:none}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">PocketWorld · Short particle trail</p>
    <h1>粒子淡下去，就立刻消失</h1>
    <p class="lead">背景仍是灰色、粒子仍是深灰色。现在粒子只在波峰附近清晰出现，离开活跃区后快速消失，不再留下大面积浅色尾迹。</p>
    <section class="choices">
      <article class="choice" data-choice="a-fast-wave" onclick="toggleSelect(this)"><div class="recommend">推荐</div><div class="preview"><div class="task-card"><canvas width="360" height="450" data-motion="wave"></canvas></div></div><div class="copy"><div class="title-row"><span class="badge">A</span><h2>短尾粒子波</h2></div><p>一条清晰的粒子波峰斜向掠过，波后迅速恢复成干净灰底，节奏最明确。</p></div></article>
      <article class="choice" data-choice="b-fast-ripple" onclick="toggleSelect(this)"><div class="preview"><div class="task-card"><canvas width="360" height="450" data-motion="ripple"></canvas></div></div><div class="copy"><div class="title-row"><span class="badge">B</span><h2>短尾中心涟漪</h2></div><p>粒子圈从中心出现后快速消退，每轮扫描之间有明显留白。</p></div></article>
      <article class="choice" data-choice="c-fast-drift" onclick="toggleSelect(this)"><div class="preview"><div class="task-card"><canvas width="360" height="450" data-motion="drift"></canvas></div></div><div class="copy"><div class="title-row"><span class="badge">C</span><h2>短生粒子流</h2></div><p>粒子像短暂火花般沿流场出现和消失，最灵动，也最随机。</p></div></article>
    </section>
    <p class="note">消失规则：透明度进入低段后不继续缓慢淡化，而是直接停止绘制；因此背景会更干净。</p>
  </main>
  <script>
    const canvases=[...document.querySelectorAll('canvas')],count=300;
    function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    const fields=new Map();canvases.forEach((c,i)=>{const r=rng(9127+i*83),p=[];for(let n=0;n<count;n++)p.push({x:r()*360,y:r()*450,s:.9+r()*1.7,k:r()*Math.PI*2,v:.4+r()*.7});fields.set(c,p)});
    function dot(ctx,x,y,r,a){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=`rgba(72,72,72,${a})`;ctx.fill()}
    function visible(energy){const v=Math.max(0,Math.min(1,(energy-.56)/.44));return v*v*(3-2*v)}
    function draw(c,t){const ctx=c.getContext('2d'),pts=fields.get(c),mode=c.dataset.motion;ctx.fillStyle='#e5e5e5';ctx.fillRect(0,0,360,450);for(const p of pts){let x=p.x,y=p.y,e=0;if(mode==='wave'){const q=t*2.05-p.x*.021-p.y*.011+p.k*.045;e=(Math.sin(q)+1)/2;y+=Math.sin(q)*5}else if(mode==='ripple'){const dx=p.x-180,dy=p.y-225,d=Math.hypot(dx,dy)||1,q=t*2.0-d*.048+p.k*.035;e=(Math.sin(q)+1)/2;x+=dx/d*Math.sin(q)*4.5;y+=dy/d*Math.sin(q)*4.5}else{const q=t*p.v*1.0+p.k,e0=(Math.sin(q)+1)/2;e=e0;x=(p.x+t*(7+p.v*5)+Math.sin(q)*3)%370-5;y+=Math.sin(p.y*.019+t*.9+p.k*.18)*7}const v=visible(e);if(v<.035)continue;dot(ctx,x,y,p.s*(.82+v*.48),.18+v*.72)}}
    const start=performance.now();function loop(n){const t=(n-start)/1000;canvases.forEach(c=>draw(c,t));requestAnimationFrame(loop)}requestAnimationFrame(loop);
  </script>
</body>
</html>
