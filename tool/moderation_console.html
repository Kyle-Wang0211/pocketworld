<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PocketWorld · 举报审核台</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 本地审核工具。只使用普通 Supabase Auth 账号；绝不接收 service-role 密钥。
     所有用户内容都用 textContent/createElement 渲染，禁止 innerHTML。 -->
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#16181d;--dim:#68707c;--line:#dde1e7;--accent:#215be8;--danger:#b42318;--ok:#067647;--chip:#eef1f5}
@media(prefers-color-scheme:dark){:root{--bg:#121418;--card:#1c2026;--fg:#edf0f5;--dim:#9ca5b2;--line:#343a44;--accent:#75a0ff;--danger:#ff8277;--ok:#5cd6a1;--chip:#292f38}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
header{position:sticky;top:0;z-index:10;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0 0 10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}input{min-width:205px}button{cursor:pointer;background:var(--chip);font-weight:650}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--accent);color:#fff}.danger{background:var(--danger);color:#fff}.ok{background:var(--ok);color:#fff}
main{max-width:1080px;margin:auto;padding:20px}.banner{border-left:3px solid var(--accent);background:var(--card);padding:10px 14px;margin-bottom:16px;color:var(--dim)}.card{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}.thumb{width:130px;height:130px;flex:0 0 130px;border-radius:8px;object-fit:cover;background:var(--chip)}.thumb.empty{display:flex;align-items:center;justify-content:center;color:var(--dim)}.body{flex:1;min-width:0}.title{font-size:15px;margin:0 0 5px}.desc{white-space:pre-wrap;word-break:break-word;color:var(--dim);margin:7px 0}.meta,.acts,.gallery{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:8px 0}.chip{padding:2px 7px;background:var(--chip);border-radius:5px;font-size:12px}.acts textarea{flex:1;min-width:210px;min-height:42px;resize:vertical}.gallery img{width:126px;height:126px;object-fit:cover;border-radius:7px;background:var(--chip)}.msg{padding:30px;text-align:center;color:var(--dim)}.err{color:var(--danger)}a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>PocketWorld · 举报审核台</h1>
  <div class="row">
    <input id="url" aria-label="Supabase URL" placeholder="Supabase URL">
    <input id="anon" type="password" aria-label="Publishable key" placeholder="publishable / anon key">
    <input id="email" type="email" autocomplete="username" placeholder="审核员邮箱">
    <input id="password" type="password" autocomplete="current-password" placeholder="密码">
    <button id="login" class="primary">登录</button><button id="logout">退出</button>
  </div>
  <div class="row" style="margin-top:9px">
    <select id="queue" aria-label="举报状态">
      <option value="pending">待领取</option><option value="in_review">审核中</option>
      <option value="needs_info">待补充</option><option value="actioned">已处置</option>
      <option value="dismissed">已驳回</option>
    </select>
    <button id="reload">刷新队列</button><span id="status"></span>
  </div>
</header>
<main>
  <div class="banner">使用普通审核员账号登录。页面只保存本标签页的短期访问令牌，不保存密码，也不接受数据库 service-role 密钥。reviewer 可分流、要求补充和驳回；只有 lead 可确认违规处置。</div>
  <div id="list"></div>
</main>
<script>
'use strict';
const DEFAULT_URL='https://tzvwkqmgaourwqrmxbyb.supabase.co';
const DEFAULT_ANON='sb_publishable_ur4tTV2iXSV4NsL3YYttyw_SIjFAMST';
const $=id=>document.getElementById(id),SS=sessionStorage;
const state={token:SS.getItem('pw_moderator_token')||'',role:'',userId:'',busy:false};
$('url').value=SS.getItem('pw_url')||DEFAULT_URL;$('anon').value=SS.getItem('pw_anon')||DEFAULT_ANON;$('email').value=SS.getItem('pw_moderator_email')||'';
const REASONS={impersonation:'冒充他人',harassment_threat:'骚扰、网暴或威胁',spam_fraud:'诈骗或广告骚扰',minor_safety:'未成年人安全',sexual_content:'色情低俗',violence_illegal:'暴力、自伤或违法信息',misinformation:'虚假误导',privacy_ip:'隐私、肖像或知识产权',other:'其他'};
function config(){const url=$('url').value.trim().replace(/\/+$/,''),anon=$('anon').value.trim();if(url)SS.setItem('pw_url',url);if(anon)SS.setItem('pw_anon',anon);return{url,anon}}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=String(text);return n}
function setStatus(text,bad=false){$('status').textContent=text;$('status').style.color=bad?'var(--danger)':'var(--dim)'}
function show(text,bad=false){$('list').textContent='';$('list').appendChild(el('div',bad?'msg err':'msg',text))}
function when(v){if(!v)return null;const d=new Date(v);return Number.isNaN(d.getTime())?null:d.toLocaleString('zh-CN')}
function chips(parent,pairs){const row=el('div','meta');for(const[k,v]of pairs){if(v!==null&&v!==undefined&&v!=='')row.appendChild(el('span','chip',`${k} ${v}`))}parent.appendChild(row)}
function thumb(url,alt){if(!url)return el('div','thumb empty','无缩略图');const i=document.createElement('img');i.className='thumb';i.src=url;i.alt=alt||'';i.loading='lazy';i.onerror=()=>i.replaceWith(el('div','thumb empty','图片加载失败'));return i}
async function call(payload){const{url,anon}=config();if(!state.token)throw new Error('请先登录审核员账号');const res=await fetch(`${url}/functions/v1/admin-reports`,{method:'POST',headers:{apikey:anon,Authorization:`Bearer ${state.token}`,'Content-Type':'application/json'},body:JSON.stringify(payload)});let body={};try{body=await res.json()}catch{}if(!res.ok){if(res.status===401){state.token='';SS.removeItem('pw_moderator_token')}throw new Error(body.error||`HTTP ${res.status}`)}return body}
async function login(){const{url,anon}=config(),email=$('email').value.trim(),password=$('password').value;if(!url||!anon||!email||!password)throw new Error('请填写 URL、publishable key、邮箱和密码');const res=await fetch(`${url}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:anon,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const body=await res.json();$('password').value='';if(!res.ok||!body.access_token)throw new Error(body.error_description||body.msg||'登录失败');state.token=body.access_token;SS.setItem('pw_moderator_token',state.token);SS.setItem('pw_moderator_email',email);const me=await call({action:'whoami'});state.role=me.role;state.userId=me.user_id||body.user?.id||'';await reload()}
function logout(){state.token='';state.role='';state.userId='';SS.removeItem('pw_moderator_token');$('password').value='';setStatus('已退出');show('请登录审核员账号。')}
async function reload(){if(state.busy)return;state.busy=true;show('载入中…');try{if(!state.role){const me=await call({action:'whoami'});state.role=me.role;state.userId=me.user_id||''}const status=$('queue').value,r=await call({action:'list',status});setStatus(`${state.role} · ${r.count} 条`);$('list').textContent='';if(!r.reports?.length){show('当前队列为空。');return}for(const rep of r.reports)$('list').appendChild(reportCard(rep))}catch(e){setStatus('失败',true);show(e.message,true)}finally{state.busy=false}}
function reportCard(rep){const t=rep.target,isUser=rep.target_type==='user',card=el('article','card');card.appendChild(thumb(t?.thumb_url,t?.title||t?.display_name));const body=el('div','body');body.appendChild(el('h2','title',`${REASONS[rep.reason]||rep.reason} · ${t?(t.title||t.display_name||t.handle||rep.target_id):rep.target_id}`));if(rep.detail)body.appendChild(el('div','desc',rep.detail));chips(body,[['层级',rep.kind==='rights'?'复杂投诉':'普通举报'],['优先级',rep.priority],['期限',when(rep.due_at)],['状态',rep.status],['举报于',when(rep.created_at)],['领取人',rep.claimed_by]]);if(rep.source_work)chips(body,[['关联作品',rep.source_work.title||rep.source_work.id],['当前状态',rep.source_work_live?.moderation_status]]);const modelUrl=rep.source_work_live?.model_url||(!isUser&&t?.model_url);if(modelUrl){const a=el('a',null,'打开关联 3D 文件');a.href=modelUrl;a.target='_blank';a.rel='noopener noreferrer';body.appendChild(a)}if(rep.preservation_state!=='not_required')chips(body,[['平台保全',rep.preservation_state]]);appendGallery(body,rep.source_assets,'平台保全件');appendGallery(body,rep.evidence,'用户证据');
  const acts=el('div','acts');
  if((rep.status==='pending'||rep.status==='needs_info')&&!rep.claimed_by){const claim=el('button','primary','领取');claim.onclick=()=>act(card,[claim],async()=>{await call({action:'claim',report_id:rep.id});return'已领取，切换到“审核中”继续处理'});acts.appendChild(claim)}
  const mine=rep.claimed_by&&rep.claimed_by===state.userId;
  if(rep.status==='in_review'&&mine){const feedback=el('textarea');feedback.placeholder='给举报人的公开反馈（必填）';const notes=el('textarea');notes.placeholder='内部审核备注（不会展示给举报人）';const more=el('button',null,'要求补充');const dismiss=el('button',null,'驳回');const actioned=el('button','danger','确认违规并处置');actioned.disabled=state.role!=='lead';const go=status=>async()=>{const publicText=feedback.value.trim();if(!publicText)throw new Error('公开反馈必填');await call({action:'transition',report_id:rep.id,status,reporter_feedback:publicText,admin_notes:notes.value.trim()});return status==='needs_info'?'已要求补充':status==='dismissed'?'已驳回':'已确认并处置'};more.onclick=()=>act(card,[more,dismiss,actioned],go('needs_info'));dismiss.onclick=()=>act(card,[more,dismiss,actioned],go('dismissed'));actioned.onclick=()=>act(card,[more,dismiss,actioned],go('actioned'));acts.append(more,dismiss,actioned,feedback,notes)}
  if(rep.claimed_by&&!mine&&rep.status==='in_review')acts.appendChild(el('span','chip','已由其他审核员领取'));
  body.appendChild(acts);card.appendChild(body);return card}
function appendGallery(parent,items,label){if(!Array.isArray(items)||!items.length)return;parent.appendChild(el('div','desc',`${label}（链接 5 分钟失效）`));const g=el('div','gallery');for(const item of items){if(!item.signed_url)continue;const a=document.createElement('a');a.href=item.signed_url;a.target='_blank';a.rel='noopener noreferrer';if((item.content_type||'').startsWith('image/')){const i=document.createElement('img');i.src=item.signed_url;i.alt=`${label} ${Number(item.ordinal)+1}`;i.loading='lazy';a.appendChild(i)}else a.appendChild(el('span','chip','打开文件'));g.appendChild(a)}parent.appendChild(g)}
async function act(card,buttons,fn){buttons.forEach(b=>b.disabled=true);const out=el('div','meta');card.querySelector('.body').appendChild(out);try{out.appendChild(el('span','chip','✓ '+await fn()));card.style.opacity='.55'}catch(e){out.appendChild(el('span','chip','✗ '+e.message));out.style.color='var(--danger)';buttons.forEach(b=>b.disabled=false)}}
$('login').onclick=()=>login().catch(e=>{setStatus('登录失败',true);show(e.message,true)});$('logout').onclick=logout;$('reload').onclick=reload;$('queue').onchange=reload;$('password').onkeydown=e=>{if(e.key==='Enter')$('login').click()};
if(state.token)reload();else show('请使用已授权的 reviewer 或 lead 账号登录。');
</script>
</body>
</html>
