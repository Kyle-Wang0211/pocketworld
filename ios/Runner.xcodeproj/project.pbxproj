			shellScript = "export COPYFILE_DISABLE=1\n\nclean_codesign_xattrs() {\n  path=\"$1\"\n  if [ ! -e \"$path\" ]; then\n    return 0\n  fi\n  /usr/bin/xattr -cr \"$path\" || true\n  /usr/bin/find \"$path\" -exec /usr/bin/xattr -d com.apple.FinderInfo {} \\; 2>/dev/null || true\n  /usr/bin/find \"$path\" -exec /usr/bin/xattr -d 'com.apple.fileprovider.fpfs#P' {} \\; 2>/dev/null || true\n}\n\n/bin/sh \"$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh\" embed_and_thin\n\n# Xcode 26 / Flutter 3.41 local device deploy: xcode_backend embeds\n# Flutter.framework on iOS without re-signing it, leaving the upstream\n# Developer ID signature in place. iPhoneOS rejects that at install time\n# (0xe8008018). Native-asset frameworks such as thermion_dart.framework\n# are worse: flutter_tools drops them into the bundle ad-hoc signed and\n# outside the Embed Frameworks phase, so Xcode never touches them at all\n# (install fails with 0xe8008014). Re-sign *every* embedded framework\n# with the Runner development identity whenever device code signing is\n# active -- an explicit list silently rots the moment a dependency adds\n# one, and the failure only shows up at install time.\nif [ \"$PLATFORM_NAME\" = \"iphoneos\" ] && [ -n \"$EXPANDED_CODE_SIGN_IDENTITY\" ] && [ \"$CODE_SIGNING_REQUIRED\" != \"NO\" ]; then\n  for framework in \"$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH\"/*.framework; do\n    if [ -d \"$framework\" ]; then\n      clean_codesign_xattrs \"$framework\"\n      /usr/bin/codesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" --timestamp=none \"$framework\"\n    fi\n  done\n\n  # Clear bundle-level extended attributes before Xcode's final app CodeSign.\n  clean_codesign_xattrs \"$TARGET_BUILD_DIR/$WRAPPER_NAME\"\nfi\n";
