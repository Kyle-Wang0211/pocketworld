training:
  runs_per_arm: 1
  epochs: 100
  batch_size: 64
  microbatch_size: 8
  data_loader_workers: 4
  prefetch_factor: 2
  worker_lifecycle_diagnostic:
    sample_count: 512
    completed_samples: 512
    iterator_completed: true
    ordered_sample_identity_sha256: 36be36e6bd3887e25c85b7d3fc5f17324408da2619839eb65c82d14a3b4d2b76
    evidence: results/phase2-workers4-lifecycle-diagnostic.json
  static_floor_early_stop:
    registered_at: 2026-08-04
    floor_bits_per_coefficient: 1.471
    floor_bits_per_pixel_equivalent: 2.2065
    coefficients_per_luma_position: 1.5
    patience_epochs: 20
    metric: train_loss_bits_per_pixel
    terminal_status: stopped_static_floor_not_reached
    evidence: results/phase2-training/<arm>/static-floor-stop.json
    derivation: >-
      Empirical entropy of 192 static per-(component, frequency-position)
      histograms measured on frozen photo A: Y 2.055, Cb 0.318, Cr 0.289 bits per
      coefficient, weighted to 1.471. That table costs under a kilobyte and
      models no spatial or cross-channel context at all.
    rationale: >-
      An arm still above this line after its patience window is spending
      megabytes of amortised model budget to do worse than a free baseline.
      Stopping there costs one training window instead of the full registered
      epoch limit, and the verdict is about the arm, not about learned JPEG
      recompression as a category.
    not_an_acceptance_line: >-
      Clearing the floor proves the arm is worth continuing. It does not pass any
      gate. The formal gate stays the measured J of 5,012,613 bytes, which for
      scope2_compact means 1.206 bits per coefficient after its 458,002-byte
      model charge.
  seed: 20260803
  device: mps_with_cpu_erfc_fallback
  environment:
    PYTORCH_ENABLE_MPS_FALLBACK: '1'
    uv_lock_sha256: 77a699a4027b023bdd5bb6ad892e8a0103796be16daa8840dcd5cb6039d14a0c
  deterministic_algorithms_where_supported: true
  main_optimizer: Adam
  main_learning_rate: 0.0001
  auxiliary_optimizer: Adam
  auxiliary_learning_rate: 0.001
  scheduler:
    name: ReduceLROnPlateau
    mode: min
    factor: 0.1
    patience: 10
  gradient_clip_max_norm: 1.0
  loss: negative_log2_likelihood_bits_per_coefficient
  invalid_if:
    - non_finite_loss
    - non_finite_gradient
    - source_identity_drift
    - frozen_capture_or_sha_leakage
    - checkpoint_not_recoverable
  checkpoint_retention:
