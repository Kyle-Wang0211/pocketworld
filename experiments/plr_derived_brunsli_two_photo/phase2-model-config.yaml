schema: pw_plr_phase2_model_config_v1
registered_at: 2026-08-03T00:00:00+08:00
upstream:
  repository: https://github.com/zhuiguangzhe123/PLR.git
  commit: 8a65e4d0d3daa9292e40df0541e8f43fcaada2d7
  tree: 67796f3cfc8ef558d3b2287fcf315a8731ae1f14
  lazy_import_patch_sha256: 96699a4fc3fa10476b784c7ae86b514c74b74609396d4f6a0b4d1f39f18e3f59
  exact_completion_patch_sha256: 307b4a6f5713e3c79845b63b86e1980b3054caef11bc05d9b1286dc5bcc84bf0
  context_normalisation_patch_sha256: 1221110f821fec69a932760645036610ce53c92638ab5eeb2d93663120a50926
implementation:
  label: PLR-derived completion
  official_reproduction: false
  reason: >-
    The public TransJPEGRecompression422 forward omits Cb/Cr rate terms and its
    compress/decompress methods reference undefined modules. The selected
    sibling supplies a complete Y/Cb/Cr 22-stage schedule, while the local
    patch replaces only the incomplete latent codec bridge with the mature
    pinned CompressAI GaussianConditionalLatentCodec and integer means.
  class: compressai.models.base_eff.EfficientJPEGRecompression
  entropy_bridge: compressai.latent_codecs.GaussianConditionalLatentCodec
  chunks:
    - scales
    - means
  frequency_groups:
    - 28
    - 8
    - 7
    - 6
    - 5
    - 4
    - 3
    - 2
    - 1
  decoder_sequential_passes: 22
  maximum_decoder_sequential_passes: 24
  frequency_scale_prior:
    registered_at: 2026-08-04
    reason: >-
      Quantized DCT sigma spans 2964x across the 64 frequency positions, so every
      scale head had to discover that range from a default initialisation. The
      epoch-2 official_width state measured 11.82 bits per coefficient, worse
      than the 8.02 bits a single pooled Gaussian achieves, i.e. predicted scales
      were systematically inflated. This registers a measured per-frequency prior
      as the initial bias of the scale half of every entropy-parameter head.
    module: pw_plr/frequency_prior.py
    artifact: frequency-prior.json
    schema: pw_plr_frequency_prior_v1
    measured_from_split: train
    measured_sample_count: 48
    corpus_content_identity_sha256: f0f1c309a4237da178c1e5e752ec8b522e2e5a44195187e32649a066a55e2b75
    frozen_pair_used: false
    excluded_capture_ids_asserted_at_measurement: true
    luma_ordering: PLR_HIGH_TO_LOW_INDICES
    luma_dc_sigma: 329.16672310413867
    luma_highest_frequency_sigma: 0.11109110416293924
    chroma_sigma: 10.772633079635
    scales_min: 0.11
    weight_damping: 0.1
    charged_in_M: true
    charged_bytes: 768
    exactness_impact: none
    exactness_argument: >-
      GaussianConditionalLatentCodec receives the coding target y untouched; the
      prior only reaches entropy_parameters, which produces scales and means from
      context. The coded alphabet, the integer CDF construction and the
      reconstructed coefficients are unchanged in definition.
    validated_initial_rate_bits_per_pixel:
      default_initialisation: 20.01
      with_prior: 13.37
      improvement_fraction: 0.332
      arm: scope2_compact
      note: >-
        Measured on four training-split patches with a fixed seed, before any
        gradient step. The default figure reproduces the observed epoch-0 value
        of 19.68, so the harness is faithful.
    context_normalisation_status: >-
      Wired as of 2026-08-04 via patches/plr-context-normalisation.patch, but
      only active on the scope2_normalised_context arm. The patched _ctx helper
      is a behavioural no-op unless attach_context_normalisation has registered
      the buffers, so the control arm's code path is unchanged.
model_arms:
  - id: official_width
    N: 192
    M: 288
  - id: scope2_compact
    N: 96
    M: 144
    context_normalisation: false
    role: control
  - id: scope2_normalised_context
    N: 96
    M: 144
    context_normalisation: true
    role: treatment
    design: docs/superpowers/specs/2026-08-04-scope2-normalised-context-arm-design.md
    control_arm: scope2_compact
    control_epoch0_train_loss_bits_per_pixel: 13.20177008136971
    control_stopped_at_epoch: 8
    control_stop_record: results/phase2-training/scope2_compact/operator-stop.json
    single_variable: >-
      Every raw coefficient tensor entering a network is divided by the
      registered prior; every coding target stays raw. Learning rates, corpus,
      split, seed, N, M, batch sizes, the prior table, the static floor and the
      patience are all byte-identical to the control.
    preregistered_predictions:
      rate_below_control_epoch0: expected
      aux_loss_falls_materially_faster_than_control: >-
        Load-bearing. Control fell 0.357 to 0.674 percent per epoch. If this arm
        still crawls under 1 percent per epoch, the "latents start far from the
        quantile initialisation" mechanism is REFUTED and must be recorded as
        such whatever the rate does.
      clears_static_floor_before_epoch_20: gate
    stop_rule: >-
      If this arm also fails the static floor, stop. Two arms is the evidence
      budget for the intra-photo learned entropy hypothesis at this scale.
      Finding a further implementation defect afterwards does not by itself
      qualify as a materially new structural hypothesis.
selection:
  uses_frozen_pair: false
  split: validation
  metric: validation_entropy_bytes_plus_ceil_model_bytes_times_photo_count_over_96
  checkpoint_rule: minimum_registered_validation_metric_over_epochs_1_through_100
  tie_breaker: smaller_complete_model_bytes_then_lexicographic_arm_id
  terminal_arms: 1
  entropy_estimator:
    validation_patch_epoch: 0
    edge_padding: exact_zero_pad_then_crop_to_registered_block_geometry
    full_photo_tile_count: ceil_luma_width_over_32_times_ceil_luma_height_over_32
    batching: group_equal_tile_counts_before_rate_accumulation
    model_cost: ceil_raw_state_dict_bytes_times_validation_photo_count_over_96
input:
  source: exact_quantized_coefficients_from_original_jpeg
  extractor:
    path: build/v0.1/pw_brunsli_training_extract
    sha256: ae74a5bddad01a16e7fbaa356aa08847b543d66e413a72aecaca6976612af22a
  synthesized_quality_75_jpeg: forbidden
  accepted_jpeg_geometry: three_component_4_2_0
  coefficient_type_on_disk: signed_int16
  coefficient_value_transform: exact_float32_cast_without_normalization
  patch:
    luma_blocks:
      - 32
      - 32
    luma_shape:
      - 32
      - 32
      - 64
    cb_shape:
      - 1
      - 128
      - 128
    cr_shape:
      - 1
      - 128
      - 128
    origin_rule: deterministic_even_block_origin_from_seed_epoch_and_image_sha256
corpus:
  first_party_manifest: phase2-training-corpus-manifest.json
  public_manifest: openimages-v7-cvdf-corpus.json
  combined_manifest: phase2-combined-corpus.json
  combined_manifest_sha256: 4949b3648ac0b0754c92558517b094dcbe78cbb8adcb8fc90868c2b0f02cebac
  combined_content_identity_sha256: f0f1c309a4237da178c1e5e752ec8b522e2e5a44195187e32649a066a55e2b75
  combined_photo_count: 10414
  combined_split_counts:
    train: 9323
    validation: 551
    diagnostic: 540
  exact_exclusion_overlap_count: 0
  public_target_count: 10000
  public_candidate_reserve_count: 35000
  reserve_basis:
    diagnostic_sample_count: 1024
    strict_4_2_0_count: 394
    strict_4_2_0_fraction: 0.384765625
    rule: expand_only_the_same_frozen_global_hash_ranking
  public_split_counts:
