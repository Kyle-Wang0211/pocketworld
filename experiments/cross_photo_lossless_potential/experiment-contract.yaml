schema: pw_cross_photo_lossless_potential_experiment_v1
frozen_at: "2026-07-30T00:00:00+08:00"
objective: >-
  Determine whether an SfM-guided, independently grouped JPEG coefficient
  archive can reach 2.165x while restoring every original JPEG byte-for-byte.
