reason:
  verdict_on_v1: invalid_before_execution
  blockers:
    - >-
      The frozen streaming API rejects null pose before writing a frame, so
      pose_off.jsonl would test an ABI guard rather than visual SfM convergence.
    - >-
      The archived database is pw_database_prune_v2 and has zero descriptors;
      the v1 replay driver therefore skips all 60 frames in both arms.
  preserved_evidence:
    - v1 files and hashes remain immutable
    - no v1 arm result may be reported as an SfM convergence result

question: >-
  On the same frozen cameras, images, keypoints and two-view inlier graph, does
  the current official visual mapper converge without reading per-frame ARKit
  pose or gravity, and how does its output compare with the current known-pose
  restore/refine path?

scope:
  classification: B1_solver_pose_off_smoke
  proves_if_successful:
    - current official visual mapper can register this 60-frame graph without absolute vendor pose
    - raw reconstruction quality and host diagnostic runtime for both supported solver paths
  does_not_prove:
    - identical streaming-call single-variable causality
    - strict A/B runtime ratio against the archived device run
    - B2 pose-independent keyframe selection, pairing, or TVG estimation
    - B3 capture with the ARKit session disabled
    - native metric scale from monocular vision
  residual_vendor_leakage:
    - the frozen TVG inlier graph was produced by the capture-time mandatory-gravity estimator

