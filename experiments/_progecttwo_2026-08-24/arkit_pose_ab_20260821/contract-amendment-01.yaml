    pose_priors: 0
    integrity_check: ok
  source_is_immutable: true
  each_arm_uses_a_fresh_unique_directory: true
  environment: /usr/bin/env_-i_allowlist_only

primary_metrics:
  - exit_code
  - registered_images
  - raw_points3d
  - raw_track3plus
  - raw_observations
  - mean_reprojection_px
  - solver_wall_ms
  - gravity_registry_hits
  - raw_model_artifact_integrity

gates:
  A_valid:
    - exit_code == 0
    - registered_images >= 57
    - raw_points3d > 0
  B1_gross_convergence:
    - exit_code == 0
    - registered_images >= 48
    - raw_points3d > 0
    - gravity_registry_hits == 0
    - no pose sidecar exists before or after the run
  interpretation:
    - reprojection error is internal consistency, not ground-truth accuracy
    - pose/cloud comparison requires camera-derived Sim3 alignment
    - runtime is diagnostic until a full-descriptor capture enables strict repeated pairing

execution:
  order: [A1, B1_1, B1_2, A2]
  proceed_to_repeats_only_if: A1_and_B1_1_pass_their_validity_gates
  reducer: report_each_run_and_the_median_per_arm
  inconsistent_repeats: unstable_inconclusive
  max_concurrent: 1

stop_conditions:
  - any frozen input or code hash mismatch
  - database preflight mismatch
  - runner RED test does not fail before implementation
  - runner build fails or changes the official core source
  - A1 fails its validity gate
  - B1 creates or requires an ARKit sidecar
  - B1 records any gravity registry hit
  - any exported model file is absent, empty, or unreadable by COLMAP model_analyzer
