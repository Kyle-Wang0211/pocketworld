[project]
name = "pocketworld-eight-photo-global-jpeg-collection"
version = "0.1.0"
description = "Strict-lossless eight-photo global JPEG collection experiment"
requires-python = ">=3.11,<3.12"
dependencies = [
  "dvc==3.67.1",
  "mlflow==3.14.0",
  "numpy==2.4.6",
  "pytest==8.4.1",
  "pyyaml==6.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

