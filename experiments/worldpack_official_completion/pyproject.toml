[project]
name = "pocketworld-worldpack-official-completion"
version = "0.1.0"
description = "Reproducible strict-lossless OpenZL, ALP, WebGraph, and WorldPack benchmark"
requires-python = ">=3.11,<3.12"
dependencies = [
  "dvc==3.67.1",
  "mlflow==3.14.0",
  "psutil==7.0.0",
  "pytest==8.4.1",
  "pyyaml==6.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

